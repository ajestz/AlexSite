<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Example</title>
    <link rel="stylesheet" href="assets/css/bootstrap.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3>Shopping List Items: <span id="counter">1</span></h3>
                    </div>
                    <div class="panel-body" id="list">
                        <div class="alert alert-info alert-dismissable">Tomatoes</div>
                    </div>
                    <div class="panel-footer">
                        <input type="text" id="itemName" class="form-control" placeholder="Enter item name">
                        <button type="button" class="btn btn-primary mt-2" id="addToList">Add Item</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/shopping-list.js"></script>
</body>
</html>
